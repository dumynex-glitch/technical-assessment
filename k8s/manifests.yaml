apiVersion: v1
kind: Namespace
metadata:
  name: paytrack
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paytrack-api
  namespace: paytrack
  labels:
    app: paytrack-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: paytrack-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: paytrack-api
    spec:
      automountServiceAccountToken: false
      containers:
      - name: paytrack
        image: paytrack-api:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        envFrom:
          - configMapRef:
              name: "paytrack-api-config"
      securityContext:
        runAsUser: 10000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: paytrack-api-config
  namespace: paytrack
data:
  APP_ENV: "sandbox"
  PORT: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: paytrack-api
  namespace: paytrack
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app: paytrack-api
